/* =========================================================
   创建游戏状态
   ========================================================= */
function createGameState(level, mode) {
  return {
    level, mode: mode || 'normal',
    isEndless: mode === 'endless',
    state: 'playing',
    lives: mode === 'defense' ? DEFENSE_MODE_START_LIVES :
           mode === 'op' ? OP_MODE_START_LIVES : 20,
    gold: level.startGold,
    wave: 0, time: 0,
    enemies: [], towers: [], defenses: [], suicideCannons: [], mines: [],
    projectiles: [], particles: [], beams: [], damageNumbers: [],
    spawnQueue: [], spawnTimer: 0, spawnInterval: 1,
    waveActive: false, betweenTimer: 6,
    selectedTowerType: null, selectedTower: null, selectedDefense: null,
    selectedSuicide: null, selectedMine: null, mouse: null,
    demonPactUsed: false, demonPactTimer: 0,
    bannedTowers: []
  };
}

function createFixedTowers(level) {
  const list = [];
  const safeTowers = ensureFixedTowersValid(level);
  for (const cfg of safeTowers) {
    list.push({
      x: cfg.x, y: cfg.y, type: cfg.type,
      dmgLvl: 1, rateLvl: 1, cooldown: 0,
      angle: -Math.PI / 2, invested: 0, fixed: true
    });
  }
  return list;
}

/* =========================================================
   随机禁用塔（箭塔永不禁）
   ========================================================= */
function rollBannedTowers() {
  if (!game) return;
  if (game.mode !== 'random' && game.mode !== 'limit') return;

  const all = Object.keys(TOWER_TYPES);
  /* 箭塔永远保留（唯一 50 金币基础塔），从剩下 5 座里随机禁 */
  const pool = all.filter(k => k !== 'arrow');
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  game.bannedTowers = shuffled.slice(0, BANNED_COUNT);

  buildShop();
  updateShopUI();
  updateModeBanner();
}

/* =========================================================
   波次配置
   ========================================================= */
const WAVE_COLORS = ['#f87171','#fb923c','#facc15','#a3e635','#34d399','#22d3ee','#818cf8','#e879f9','#f472b6','#94a3b8'];

function waveConfig(w) {
  const level = game.level;
  const baseWaveCount = 12;
  let hp, speed, reward;

  if (isInfiniteMode() && w > baseWaveCount) {
    const extraWaves = w - baseWaveCount;
    const hpBase12 = 24 * Math.pow(1.35, baseWaveCount - 1) * level.hpMult;
    const spdBase12 = (52 + baseWaveCount * 3) * level.speedMult;
    const rwBase12 = (4 + baseWaveCount * 1.8) * level.rewardMult;
    hp = Math.round(hpBase12 * Math.pow(ENDLESS_HP_GROWTH, extraWaves));
    speed = spdBase12 + extraWaves * ENDLESS_SPD_GROWTH * level.speedMult;
    reward = Math.round(rwBase12 + extraWaves * ENDLESS_REWARD_GROWTH * level.rewardMult);
  } else {
    hp = Math.round(24 * Math.pow(1.35, w - 1) * level.hpMult);
    speed = (52 + w * 3) * level.speedMult;
    reward = Math.round((4 + w * 1.8) * level.rewardMult);
  }

  return {
    count: 6 + w * 2,
    hp, speed, reward,
    interval: Math.max(0.4, 0.95 - w * 0.04),
    boss: w % 5 === 0,
    color: WAVE_COLORS[(w - 1) % WAVE_COLORS.length]
  };
}

function startWave() {
  game.wave++;

  if (game.mode === 'random') {
    rollBannedTowers();
  }

  const cfg = waveConfig(game.wave);
  game.spawnQueue = [];
  for (let i = 0; i < cfg.count; i++) {
    game.spawnQueue.push({ hp: cfg.hp, speed: cfg.speed, reward: cfg.reward, boss: false, color: cfg.color });
  }
  if (cfg.boss) {
    game.spawnQueue.push({ hp: cfg.hp * 7, speed: cfg.speed * 0.55, reward: cfg.reward * 10, boss: true, color: '#ef4444' });
  }
  game.spawnTimer = 0;
  game.spawnInterval = cfg.interval;
  game.waveActive = true;
  sfxWaveStart();
}

/* =========================================================
   生成 / 更新怪物
   ========================================================= */
function spawnEnemy(cfg) {
  const path = game.level.path;
  game.enemies.push({
    x: path[0].x, y: path[0].y, wp: 1,
    hp: cfg.hp, maxHp: cfg.hp,
    speed: cfg.speed, reward: cfg.reward,
    radius: cfg.boss ? 22 : 13,
    color: cfg.color, boss: cfg.boss,
    slowTimer: 0, slowAmount: 0, poisonTimer: 0, poisonDps: 0,
    distTraveled: 0, dead: false, reachedEnd: false, bitingDefense: null
  });
}

function findBlockingDefense(e) {
  for (const d of game.defenses) {
    if (d.dead) continue;
    if (Math.hypot(e.x - d.x, e.y - d.y) < DEFENSE_TOWER_BITE_RANGE) return d;
  }
  return null;
}

function updateEnemy(e, dt) {
  if (e.slowTimer > 0) e.slowTimer -= dt;
  const iceSlow = e.slowTimer > 0 ? e.slowAmount : 0;
  const poisonSlow = e.poisonTimer > 0 ? POISON_SLOW : 0;
  const mult = 1 - Math.max(iceSlow, poisonSlow);

  if (e.poisonTimer > 0) {
    e.poisonTimer -= dt;
    e.hp -= e.poisonDps * dt;
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      game.gold += e.reward;
      spawnParticles(e.x, e.y, '#a3e635', e.boss ? 26 : 12);
      return;
    }
  }

  const blocker = findBlockingDefense(e);
  e.bitingDefense = blocker;
  if (blocker) return;

  let move = e.speed * mult * dt;
  e.distTraveled += move;
  const path = game.level.path;
  while (move > 0 && e.wp < path.length) {
    const t = path[e.wp];
    const dx = t.x - e.x, dy = t.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d <= move) { e.x = t.x; e.y = t.y; e.wp++; move -= d; }
    else { e.x += dx / d * move; e.y += dy / d * move; move = 0; }
  }
  if (e.wp >= path.length) e.reachedEnd = true;
}

/* =========================================================
   伤害 / 粒子 / 飘字
   ========================================================= */
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 120;
    game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45 + Math.random() * 0.35, maxLife: 0.8, color, size: 1.5 + Math.random() * 2.5 });
  }
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 45; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 90 + Math.random() * 300;
    game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.55 + Math.random() * 0.5, maxLife: 1.05, color: Math.random() < 0.5 ? '#ef4444' : '#fb923c', size: 2 + Math.random() * 4 });
  }
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 100 + Math.random() * 220;
    game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.3, maxLife: 0.6, color: '#fef2f2', size: 3 + Math.random() * 3 });
  }
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * 150;
    game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7 + Math.random() * 0.4, maxLife: 1.1, color: '#7f1d1d', size: 4 + Math.random() * 3 });
  }
}

function spawnDamageNumber(x, y, dmg) {
  if (dmg < 15) return;
  /* 爽模式：伤害数字更大更亮 */
  const isOp = game && game.mode === 'op';
  game.damageNumbers.push({
    x: x + (Math.random() - 0.5) * 12, y: y - 8,
    value: Math.round(dmg), life: isOp ? 0.9 : 0.7, maxLife: isOp ? 0.9 : 0.7,
    vx: (Math.random() - 0.5) * 25, vy: -55 - Math.random() * 20,
    color: dmg >= 100 ? '#fbbf24' : dmg >= 50 ? '#f97316' : '#ffffff',
    size: dmg >= 1000 ? 20 : dmg >= 100 ? 15 : dmg >= 50 ? 13 : 11
  });
}

function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  spawnDamageNumber(e.x, e.y, dmg);
  if (e.hp <= 0) {
    e.dead = true;
    game.gold += e.reward;
    spawnParticles(e.x, e.y, e.color, e.boss ? 26 : 10);
  }
}

/* =========================================================
   防御塔逻辑
   ========================================================= */
function findTarget(t) {
  const range = TOWER_TYPES[t.type].range;
  let best = null, bestScore = -Infinity;
  for (const e of game.enemies) {
    if (e.dead || e.reachedEnd) continue;
    const d = Math.hypot(e.x - t.x, e.y - t.y);
    if (d > range + e.radius) continue;
    let score = e.distTraveled;
    if (e.bitingDefense && !e.bitingDefense.dead) score += 1e6;
    if (score > bestScore) { bestScore = score; best = e; }
  }
  return best;
}

function shoot(t, target) {
  const def = TOWER_TYPES[t.type];
  t.angle = Math.atan2(target.y - t.y, target.x - t.x);
  if (settings.soundEnabled) {
    if (t.type === 'arrow') sfxArrow();
    else if (t.type === 'cannon') sfxCannon();
    else if (t.type === 'frost') sfxFrost();
    else if (t.type === 'sniper') sfxSniper();
    else if (t.type === 'laser') sfxLaser();
    else if (t.type === 'poison') sfxPoison();
  }
  if (t.type === 'laser') {
    game.beams.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 0.16, maxLife: 0.16, color: '#f472b6', width: 3 });
    damageEnemy(target, towerDamage(t));
    spawnParticles(target.x, target.y, '#fbcfe8', 3);
    return;
  }
  if (t.type === 'sniper') {
    game.beams.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 0.22, maxLife: 0.22, color: '#c084fc', width: 7 });
    spawnParticles(t.x, t.y, '#e9d5ff', 5);
  }
  const speed = t.type === 'sniper' ? 950 : t.type === 'cannon' ? 330 : 580;
  game.projectiles.push({
    x: t.x, y: t.y, target, speed,
    damage: towerDamage(t),
    splash: def.splash || 0,
    slow: def.slow || 0, slowDur: def.slowDur || 0,
    poisonDmg: def.poisonDmg || 0, poisonDur: def.poisonDur || 0,
    color: def.color,
    radius: t.type === 'cannon' ? 5 : 3,
    isSniper: t.type === 'sniper', isPoison: t.type === 'poison'
  });
}

function applyHit(p) {
  if (p.splash > 0) {
    for (const e of game.enemies) {
      if (e.dead || e.reachedEnd) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) <= p.splash) {
        damageEnemy(e, p.damage);
        if (!e.dead) {
          if (p.slow > 0) { e.slowTimer = p.slowDur; e.slowAmount = p.slow; }
          if (p.poisonDmg > 0) {
            e.poisonTimer = Math.max(e.poisonTimer || 0, p.poisonDur);
            e.poisonDps = Math.max(e.poisonDps || 0, p.poisonDmg);
          }
        }
      }
    }
    spawnParticles(p.x, p.y, '#fb923c', 14);
  } else {
    if (p.target && !p.target.dead) {
      damageEnemy(p.target, p.damage);
      if (!p.target.dead) {
        if (p.slow > 0) { p.target.slowTimer = p.slowDur; p.target.slowAmount = p.slow; }
        if (p.poisonDmg > 0) {
          p.target.poisonTimer = Math.max(p.target.poisonTimer || 0, p.poisonDur);
          p.target.poisonDps = Math.max(p.target.poisonDps || 0, p.poisonDmg);
        }
      }
    }
    if (p.isSniper) { spawnParticles(p.x, p.y, '#e9d5ff', 12); spawnParticles(p.x, p.y, '#c084fc', 8); }
    else if (p.isPoison) spawnParticles(p.x, p.y, '#a3e635', 6);
    else spawnParticles(p.x, p.y, p.color, 4);
  }
}

/* =========================================================
   建造 / 升级 / 出售
   ========================================================= */
function canPlaceNormal(x, y) {
  if (x < 24 || x > W - 24 || y < 24 || y > H - 24) return false;
  if (minDistToPath(x, y, game.level.path) < 40) return false;
  for (const t of game.towers) if (Math.hypot(t.x - x, t.y - y) < 38) return false;
  for (const d of game.defenses) if (Math.hypot(d.x - x, d.y - y) < 38) return false;
  for (const s of game.suicideCannons) if (Math.hypot(s.x - x, s.y - y) < 38) return false;
  for (const m of game.mines) if (Math.hypot(m.x - x, m.y - y) < 38) return false;
  return true;
}

function canPlaceDefense(x, y) {
  if (x < 24 || x > W - 24 || y < 24 || y > H - 24) return false;
  if (minDistToPath(x, y, game.level.path) > DEFENSE_TOWER_PATH_DIST) return false;
  for (const t of game.towers) if (Math.hypot(t.x - x, t.y - y) < 34) return false;
  for (const d of game.defenses) if (Math.hypot(d.x - x, d.y - y) < 34) return false;
  for (const s of game.suicideCannons) if (Math.hypot(s.x - x, s.y - y) < 34) return false;
  for (const m of game.mines) if (Math.hypot(m.x - x, m.y - y) < 34) return false;
  return true;
}

function canPlaceSuicide(x, y) {
  if (x < 24 || x > W - 24 || y < 24 || y > H - 24) return false;
  for (const t of game.towers) if (Math.hypot(t.x - x, t.y - y) < 38) return false;
  for (const d of game.defenses) if (Math.hypot(d.x - x, d.y - y) < 38) return false;
  for (const s of game.suicideCannons) if (Math.hypot(s.x - x, s.y - y) < 38) return false;
  for (const m of game.mines) if (Math.hypot(m.x - x, m.y - y) < 38) return false;
  return true;
}

function canPlaceMine(x, y) {
  if (x < 24 || x > W - 24 || y < 24 || y > H - 24) return false;
  for (const t of game.towers) if (Math.hypot(t.x - x, t.y - y) < 32) return false;
  for (const d of game.defenses) if (Math.hypot(d.x - x, d.y - y) < 32) return false;
  for (const s of game.suicideCannons) if (Math.hypot(s.x - x, s.y - y) < 32) return false;
  for (const m of game.mines) if (Math.hypot(m.x - x, m.y - y) < 28) return false;
  return true;
}

function tryPlace(x, y) {
  const key = game.selectedTowerType;
  if (!key) return;
  const cost = getTowerCost(key);

  if (key === 'defense') {
    if (game.gold < cost) { showToast('金币不足！'); return; }
    if (!canPlaceDefense(x, y)) { showToast('防御炮台只能建在路径上'); return; }
    game.gold -= cost;
    const hp = getDefenseMaxHp();
    game.defenses.push({ x, y, hp: hp, maxHp: hp, bitten: false, dead: false, invested: cost });
    spawnParticles(x, y, '#94a3b8', 15);
    spawnParticles(x, y, '#cbd5e1', 8);
    sfxPlaceDefense();
    game.selectedTowerType = null;
    updateShopUI();
    return;
  }

  if (key === 'suicide') {
    if (game.gold < cost) { showToast('金币不足！'); return; }
    if (!canPlaceSuicide(x, y)) { showToast('此处无法建造'); return; }
    game.gold -= cost;
    game.suicideCannons.push({ x, y, countdown: SUICIDE_CANNON_COUNTDOWN, exploded: false, invested: cost, lastCountdownInt: SUICIDE_CANNON_COUNTDOWN });
    spawnParticles(x, y, '#ef4444', 15);
    spawnParticles(x, y, '#fb923c', 10);
    sfxPlaceSuicide();
    game.selectedTowerType = null;
    updateShopUI();
    return;
  }

  if (key === 'mine') {
    if (game.gold < cost) { showToast('金币不足！'); return; }
    if (!canPlaceMine(x, y)) { showToast('此处无法放置'); return; }
    game.gold -= cost;
    game.mines.push({ x, y, exploded: false, invested: cost });
    spawnParticles(x, y, '#f97316', 12);
    spawnParticles(x, y, '#fbbf24', 6);
    sfxPlaceMine();
    game.selectedTowerType = null;
    updateShopUI();
    return;
  }

  const def = TOWER_TYPES[key];
  if (!isTowerUnlocked(key)) {
    if (game.mode === 'random' || game.mode === 'limit') showToast('本波此塔被禁用');
    else showToast('该塔尚未解锁');
    return;
  }
  if (game.mode === 'defense') { showToast('生存赛只能建防御炮台'); return; }
  if (game.gold < cost) { showToast('金币不足！'); return; }
  if (!canPlaceNormal(x, y)) { showToast('此处无法建造'); return; }

  game.gold -= cost;
  /* 爽模式：建造即满级 */
  const isOp = game.mode === 'op';
  game.towers.push({
    x, y, type: key,
    dmgLvl: isOp ? MAX_LEVEL : 1,
    rateLvl: isOp ? MAX_LEVEL : 1,
    cooldown: 0, angle: -Math.PI / 2,
    invested: cost, fixed: false
  });
  spawnParticles(x, y, def.color, isOp ? 20 : 10);
  sfxPlaceTower();
  game.selectedTowerType = null;
  updateShopUI();
}

function doUpgrade(t, kind) {
  /* 爽模式不用升级 */
  if (game.mode === 'op') { showToast('爽模式：塔已经是满级了'); return; }
  const cost = upgradeCost(t, kind);
  if (game.gold < cost) { showToast('金币不足！'); return; }
  const lvl = kind === 'dmg' ? t.dmgLvl : t.rateLvl;
  if (lvl >= MAX_LEVEL) return;
  game.gold -= cost;
  t.invested += cost;
  if (kind === 'dmg') t.dmgLvl++; else t.rateLvl++;
  spawnParticles(t.x, t.y, '#fbbf24', 10);
  sfxUpgrade();
  lastPanelSig = '';
}

function sellTower(t) {
  if (t.fixed) { showToast('城堡固定塔无法出售'); return; }
  const refund = Math.floor(t.invested * 0.6);
  game.gold += refund;
  game.towers = game.towers.filter(x => x !== t);
  game.selectedTower = null;
  lastPanelSig = '';
  sfxSell();
  showToast('已出售，返还 🪙' + refund, true);
}

function sellDefense(d) {
  if (d.bitten) { showToast('已被啃咬，无法出售'); return; }
  const refund = Math.floor(d.invested * DEFENSE_TOWER_SELL_RATIO);
  game.gold += refund;
  game.defenses = game.defenses.filter(x => x !== d);
  game.selectedDefense = null;
  lastPanelSig = '';
  sfxSell();
  showToast('已出售，返还 🪙' + refund, true);
}

function sellMine(m) {
  if (m.exploded) { showToast('地雷已经爆炸'); return; }
  const refund = Math.floor(m.invested * 0.5);
  game.gold += refund;
  game.mines = game.mines.filter(x => x !== m);
  game.selectedMine = null;
  lastPanelSig = '';
  sfxSell();
  showToast('已拆除，返还 🪙' + refund, true);
}

function useDemonPact(sourceTower) {
  if (!isDemonPactAvailable()) { showToast('该模式无法使用恶魔契约'); return; }
  if (game.demonPactUsed) { showToast('恶魔契约已经用过了'); return; }
  if (game.gold < DEMON_PACT_COST) { showToast('金币不足！'); return; }
  game.gold -= DEMON_PACT_COST;
  game.demonPactUsed = true;
  game.demonPactTimer = DEMON_PACT_DURATION;
  for (const tower of game.towers) {
    tower.demonOriginalDmg = tower.dmgLvl;
    tower.demonOriginalRate = tower.rateLvl;
    tower.dmgLvl = MAX_LEVEL;
    tower.rateLvl = MAX_LEVEL;
    spawnParticles(tower.x, tower.y, '#ef4444', 12);
    spawnParticles(tower.x, tower.y, '#f97316', 8);
  }
  spawnParticles(sourceTower.x, sourceTower.y, '#ef4444', 30);
  spawnParticles(sourceTower.x, sourceTower.y, '#7f1d1d', 20);
  sfxDemon();
  showToast('😈 恶魔契约生效！全塔满级 10 秒', true);
  lastPanelSig = '';
}

/* =========================================================
   暂停 / 倍速 / 音效
   ========================================================= */
function togglePause() {
  if (!game || game.state === 'won' || game.state === 'lost') return;
  if (game.state === 'playing') {
    game.state = 'paused';
    pauseMaskEl.classList.remove('hidden');
    pauseBtn.textContent = '▶';
    pauseBtn.classList.add('active');
  } else if (game.state === 'paused') {
    game.state = 'playing';
    pauseMaskEl.classList.add('hidden');
    pauseBtn.textContent = '⏸';
    pauseBtn.classList.remove('active');
  }
}

function toggleSpeed() {
  settings.speedMultiplier = settings.speedMultiplier === 1 ? 2 : 1;
  saveSettings();
  updateSpeedButton();
}

function updateSpeedButton() {
  speedBtn.textContent = settings.speedMultiplier + '×';
  if (settings.speedMultiplier === 2) speedBtn.classList.add('active');
  else speedBtn.classList.remove('active');
}

function toggleSound() {
  settings.soundEnabled = !settings.soundEnabled;
  saveSettings();
  if (settings.soundEnabled) {
    soundBtn.textContent = '🔊';
    soundBtn.classList.remove('muted');
    ensureAudio();
    setTimeout(() => playTone(800, 0.1, 'sine', 0.5), 50);
  } else {
    soundBtn.textContent = '🔇';
    soundBtn.classList.add('muted');
  }
}

function updateSoundButton() {
  if (settings.soundEnabled) {
    soundBtn.textContent = '🔊';
    soundBtn.classList.remove('muted');
  } else {
    soundBtn.textContent = '🔇';
    soundBtn.classList.add('muted');
  }
}

/* =========================================================
   主更新
   ========================================================= */
function update(dt) {
  if (!game || game.state !== 'playing') return;
  game.time += dt;

  if (game.demonPactTimer > 0) {
    game.demonPactTimer -= dt;
    if (game.demonPactTimer <= 0) {
      game.demonPactTimer = 0;
      for (const tower of game.towers) {
        if (tower.demonOriginalDmg !== undefined) {
          tower.dmgLvl = tower.demonOriginalDmg;
          tower.rateLvl = tower.demonOriginalRate;
          delete tower.demonOriginalDmg;
          delete tower.demonOriginalRate;
          spawnParticles(tower.x, tower.y, '#64748b', 10);
        }
      }
      showToast('恶魔契约结束', true);
      lastPanelSig = '';
    }
  }

  if (game.waveActive) {
    if (game.spawnQueue.length > 0) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        spawnEnemy(game.spawnQueue.shift());
        game.spawnTimer = game.spawnInterval;
      }
    } else if (game.enemies.length === 0) {
      game.waveActive = false;
      if (game.mode === 'defense') {
        game.gold += DEFENSE_MODE_WAVE_BONUS;
        showToast('本波结束 · 奖励 🪙' + DEFENSE_MODE_WAVE_BONUS, true);
      }
      if (isInfiniteMode()) {
        game.betweenTimer = game.mode === 'op' ? 2 : 3;
      } else if (game.wave >= game.level.waveCount) {
        game.state = 'won';
        onLevelComplete();
        sfxWin();
        showOverlay(true);
        return;
      } else {
        game.betweenTimer = 4;
      }
    }
  } else {
    game.betweenTimer -= dt;
    if (game.betweenTimer <= 0) startWave();
  }

  for (const e of game.enemies) if (!e.dead) updateEnemy(e, dt);

  for (const m of game.mines) {
    if (m.exploded) continue;
    let triggered = false;
    for (const e of game.enemies) {
      if (e.dead || e.reachedEnd) continue;
      if (Math.hypot(e.x - m.x, e.y - m.y) < MINE_TRIGGER_RADIUS + e.radius) {
        triggered = true;
        break;
      }
    }
    if (triggered) {
      m.exploded = true;
      for (const e of game.enemies) {
        if (e.dead || e.reachedEnd) continue;
        if (Math.hypot(e.x - m.x, e.y - m.y) <= MINE_RADIUS) damageEnemy(e, MINE_DAMAGE);
      }
      spawnExplosion(m.x, m.y);
      sfxMineTrigger();
    }
  }

  const hadMine = game.mines.length;
  game.mines = game.mines.filter(m => !m.exploded);
  if (game.mines.length !== hadMine && game.selectedMine && game.selectedMine.exploded) {
    game.selectedMine = null;
    lastPanelSig = '';
  }

  const biteRate = getDefenseBiteRate();
  for (const d of game.defenses) {
    if (d.dead) continue;
    let hasBiter = false;
    for (const e of game.enemies) {
      if (e.dead || e.reachedEnd) continue;
      if (Math.hypot(e.x - d.x, e.y - d.y) < DEFENSE_TOWER_BITE_RANGE) { hasBiter = true; break; }
    }
    if (hasBiter) {
      d.hp -= biteRate * dt;
      d.bitten = true;
      if (Math.random() < dt * 6) {
        spawnParticles(d.x + (Math.random() - 0.5) * 20, d.y + (Math.random() - 0.5) * 20, '#f87171', 2);
      }
      if (d.hp <= 0) {
        d.hp = 0;
        d.dead = true;
        spawnParticles(d.x, d.y, '#94a3b8', 25);
        spawnParticles(d.x, d.y, '#64748b', 15);
        spawnParticles(d.x, d.y, '#f87171', 10);
      }
    }
  }

  const hadDefense = game.defenses.length;
  game.defenses = game.defenses.filter(d => !d.dead);
  if (game.defenses.length !== hadDefense && game.selectedDefense && game.selectedDefense.dead) {
    game.selectedDefense = null;
    lastPanelSig = '';
  }

  for (const s of game.suicideCannons) {
    if (s.exploded) continue;
    s.countdown -= dt;
    const currentInt = Math.ceil(Math.max(0, s.countdown));
    if (currentInt !== s.lastCountdownInt && currentInt > 0) {
      s.lastCountdownInt = currentInt;
      sfxCountdown();
    }
    if (s.countdown <= 0) {
      s.exploded = true;
      for (const e of game.enemies) {
        if (e.dead || e.reachedEnd) continue;
        if (Math.hypot(e.x - s.x, e.y - s.y) <= SUICIDE_CANNON_RADIUS) damageEnemy(e, SUICIDE_CANNON_DAMAGE);
      }
      spawnExplosion(s.x, s.y);
      sfxExplosion();
    }
  }

  const hadSuicide = game.suicideCannons.length;
  game.suicideCannons = game.suicideCannons.filter(s => !s.exploded);
  if (game.suicideCannons.length !== hadSuicide && game.selectedSuicide && game.selectedSuicide.exploded) {
    game.selectedSuicide = null;
    lastPanelSig = '';
  }

  for (const e of game.enemies) {
    if (e.reachedEnd && !e.dead) {
      e.dead = true;
      game.lives -= e.boss ? 5 : 1;
      if (game.lives <= 0) {
        game.lives = 0;
        game.state = 'lost';
        sfxLose();
        showOverlay(false);
        return;
      }
    }
  }

  for (const t of game.towers) {
    t.cooldown -= dt;
    if (t.cooldown <= 0) {
      const target = findTarget(t);
      if (target) {
        shoot(t, target);
        t.cooldown = 1 / towerFireRate(t);
      } else t.cooldown = 0;
    }
  }

  for (const p of game.projectiles) {
    if (!p.target || p.target.dead || p.target.reachedEnd) { p.dead = true; continue; }
    const dx = p.target.x - p.x, dy = p.target.y - p.y;
    const d = Math.hypot(dx, dy);
    const step = p.speed * dt;
    if (d <= step) {
      p.x = p.target.x; p.y = p.target.y;
      applyHit(p);
      p.dead = true;
    } else { p.x += dx / d * step; p.y += dy / d * step; }
  }
  game.projectiles = game.projectiles.filter(p => !p.dead);

  for (const b of game.beams) b.life -= dt;
  game.beams = game.beams.filter(b => b.life > 0);

  const friction = Math.pow(0.94, dt * 60);
  for (const pt of game.particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= friction; pt.vy *= friction;
    pt.life -= dt;
  }
  game.particles = game.particles.filter(p => p.life > 0);

  for (const dn of game.damageNumbers) {
    dn.x += dn.vx * dt; dn.y += dn.vy * dt;
    dn.vy += 90 * dt; dn.life -= dt;
  }
  game.damageNumbers = game.damageNumbers.filter(d => d.life > 0);

  game.enemies = game.enemies.filter(e => !e.dead && !e.reachedEnd);
}

function onLevelComplete() {
  progress.completed[game.level.id] = true;
  if (game.level.id + 1 <= LEVELS.length) {
    progress.unlockedLevel = Math.max(progress.unlockedLevel, game.level.id + 1);
  }
  saveProgress();
}

function onSpecialModeGameOver() {
  if (!game) return;
  let changed = false;
  if (game.mode === 'endless') {
    if (game.wave > progress.endlessBest) { progress.endlessBest = game.wave; changed = true; }
    if (Math.floor(game.gold) > progress.endlessMaxGold) { progress.endlessMaxGold = Math.floor(game.gold); changed = true; }
    deleteEndlessSave();
  } else if (game.mode === 'limit') {
    if (game.wave > progress.limitBest) { progress.limitBest = game.wave; changed = true; }
  } else if (game.mode === 'random') {
    if (game.wave > progress.randomBest) { progress.randomBest = game.wave; changed = true; }
  } else if (game.mode === 'defense') {
    if (game.wave > progress.defenseBest) { progress.defenseBest = game.wave; changed = true; }
  } else if (game.mode === 'op') {
    if (game.wave > progress.opBest) { progress.opBest = game.wave; changed = true; }
  }
  if (changed) saveProgress();
}

/* =========================================================
   绘制
   ========================================================= */
function strokePath(path) {
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(70, 100, 150, 0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawPath() {
  const path = game.level.path;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* 爽模式路径加金色发光 */
  if (game.mode === 'op') {
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.15)';
    ctx.lineWidth = 72;
    strokePath(path);
  }
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)'; ctx.lineWidth = 64; strokePath(path);
  ctx.strokeStyle = game.mode === 'op' ? '#3a2a08' : '#1b2a45'; ctx.lineWidth = 52; strokePath(path);
  ctx.strokeStyle = game.mode === 'op' ? '#5a4210' : '#24374f'; ctx.lineWidth = 44; strokePath(path);
  ctx.setLineDash([10, 16]); ctx.lineDashOffset = -game.time * 40;
  ctx.strokeStyle = game.mode === 'op' ? 'rgba(251, 191, 36, 0.5)' : 'rgba(125, 175, 235, 0.28)';
  ctx.lineWidth = 3; strokePath(path);
  ctx.setLineDash([]);
  const startX = Math.max(26, path[0].x + 34);
  ctx.beginPath(); ctx.arc(startX, path[0].y, 26, 0, Math.PI * 2);
  ctx.fillStyle = game.mode === 'op' ? 'rgba(251, 191, 36, 0.22)' : 'rgba(168, 85, 247, 0.22)'; ctx.fill();
  ctx.strokeStyle = game.mode === 'op' ? 'rgba(251, 191, 36, 0.7)' : 'rgba(168, 85, 247, 0.6)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawCastle() {
  const path = game.level.path;
  const last = path[path.length - 1];
  const bx = last.x - 10, by = last.y;
  const t = game.time;
  const pulse1 = 0.5 + 0.5 * Math.sin(t * 3.0);
  const pulse2 = 0.5 + 0.5 * Math.sin(t * 2.0 + 1.3);
  const maxLives = game.mode === 'defense' ? DEFENSE_MODE_START_LIVES :
                   game.mode === 'op' ? OP_MODE_START_LIVES : 20;
  const hpRatio = Math.min(1, game.lives / maxLives);
  let baseColor, rgbStr;
  if (hpRatio > 0.6) { baseColor = '#38bdf8'; rgbStr = '56, 189, 248'; }
  else if (hpRatio > 0.3) { baseColor = '#fbbf24'; rgbStr = '251, 191, 36'; }
  else { baseColor = '#ef4444'; rgbStr = '239, 68, 68'; }
  ctx.beginPath(); ctx.arc(bx, by, 30 + pulse1 * 14, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(' + rgbStr + ', ' + (0.4 * (1 - pulse1)) + ')'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by, 24 + pulse2 * 11, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(' + rgbStr + ', ' + (0.32 * (1 - pulse2)) + ')'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.save(); ctx.shadowBlur = 26 + pulse1 * 16; ctx.shadowColor = baseColor;
  ctx.beginPath(); ctx.arc(bx, by, 20, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(' + rgbStr + ', 0.35)'; ctx.fill();
  ctx.strokeStyle = baseColor; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(' + rgbStr + ', 0.15)'; ctx.fill();
  const dotCount = 4, dotAngleBase = t * 1.6;
  for (let i = 0; i < dotCount; i++) {
    const angle = dotAngleBase + (i / dotCount) * Math.PI * 2;
    const dx = Math.cos(angle) * 28, dy = Math.sin(angle) * 28;
    ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = baseColor;
    ctx.beginPath(); ctx.arc(bx + dx, by + dy, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = baseColor; ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 14 + pulse1 * 10; ctx.shadowColor = baseColor;
  ctx.fillStyle = '#ffffff'; ctx.fillText('🏰', bx, by + 1); ctx.restore();
  if (hpRatio <= 0.5) {
    const warnPulse = 0.5 + 0.5 * Math.sin(t * 8);
    ctx.beginPath(); ctx.arc(bx, by, 34 + warnPulse * 4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(239, 68, 68, ' + (0.25 + warnPulse * 0.35) + ')';
    ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawRange(x, y, r, color) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color + '14'; ctx.fill();
  ctx.strokeStyle = color + '88'; ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
}

function drawTowers() {
  for (const t of game.towers) {
    const def = TOWER_TYPES[t.type];
    /* 爽模式：塔底下金色光环 */
    if (game.mode === 'op') {
      const opPulse = 0.5 + 0.5 * Math.sin(game.time * 4 + t.x * 0.01);
      ctx.beginPath(); ctx.arc(t.x, t.y, 22 + opPulse * 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.3 + opPulse * 0.4})`;
      ctx.lineWidth = 2; ctx.stroke();
    }
    if (t.demonOriginalDmg !== undefined) {
      const pulse = 0.5 + 0.5 * Math.sin(game.time * 8);
      ctx.beginPath(); ctx.arc(t.x, t.y, 26 + pulse * 5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(239, 68, 68, ${0.35 + pulse * 0.45})`; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(t.x, t.y, 30 + pulse * 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(249, 115, 22, ${0.15 + pulse * 0.25})`; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, Math.PI * 2);
    ctx.fillStyle = '#0f1a2c'; ctx.fill();
    ctx.strokeStyle = def.color + '55'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle);
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.roundRect(0, -4.5, 22, 9, 3); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI * 2); ctx.fillStyle = def.color; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, 6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(10, 20, 35, 0.75)'; ctx.fill();
    const totalLv = (t.dmgLvl - 1) + (t.rateLvl - 1);
    if (totalLv > 0) {
      ctx.fillStyle = '#fbbf24';
      for (let i = 0; i < totalLv; i++) { ctx.beginPath(); ctx.arc(t.x - 8 + i * 5, t.y + 21, 2, 0, Math.PI * 2); ctx.fill(); }
    }
    if (t.fixed) {
      ctx.beginPath(); ctx.arc(t.x, t.y, 23, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)'; ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fbbf24'; ctx.fillText('🏰', t.x, t.y - 27);
    }
    if (game.selectedTower === t) {
      ctx.beginPath(); ctx.arc(t.x, t.y, 21, 0, Math.PI * 2);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }
}

function drawDefenses() {
  for (const d of game.defenses) {
    const t = game.time;
    const hpRatio = Math.max(0, d.hp / d.maxHp);
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.beginPath(); ctx.ellipse(d.x, d.y + 4, 20, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(t * 0.8);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const r = 24;
      const px = Math.cos(angle) * r, py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    let shieldColor;
    if (game.mode === 'op') {
      /* 爽模式：护盾金光 */
      shieldColor = `rgba(251, 191, 36, ${0.7 + pulse * 0.3})`;
    } else {
      if (hpRatio > 0.6) shieldColor = `rgba(148, 163, 184, ${0.5 + pulse * 0.4})`;
      else if (hpRatio > 0.3) shieldColor = `rgba(251, 191, 36, ${0.55 + pulse * 0.4})`;
      else shieldColor = `rgba(239, 68, 68, ${0.7 + pulse * 0.3})`;
    }
    ctx.strokeStyle = shieldColor; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(d.x, d.y, 18 + pulse * 2, 0, Math.PI * 2);
    ctx.fillStyle = hpRatio > 0.3 ? 'rgba(148, 163, 184, 0.15)' : 'rgba(239, 68, 68, 0.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(d.x, d.y, 16, 0, Math.PI * 2); ctx.fillStyle = '#1e293b'; ctx.fill();
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI * 2); ctx.fillStyle = '#334155'; ctx.fill();
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2e8f0'; ctx.fillText('🛡️', d.x, d.y + 1);
    const bw = 40, bh = 5, bx = d.x - bw / 2, by = d.y - 32;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    let barColor;
    if (hpRatio > 0.6) barColor = '#4ade80';
    else if (hpRatio > 0.3) barColor = '#facc15';
    else barColor = '#ef4444';
    ctx.fillStyle = barColor; ctx.fillRect(bx, by, bw * hpRatio, bh);
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2e8f0';
    /* 爽模式：血量以万/千为单位显示 */
    const hpText = game.mode === 'op' ? (Math.ceil(d.hp) + '') : (Math.ceil(d.hp) + '/' + d.maxHp);
    ctx.fillText(hpText, d.x, by - 6);
    if (game.selectedDefense === d) {
      ctx.beginPath(); ctx.arc(d.x, d.y, 28, 0, Math.PI * 2);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    const hasBiter = game.enemies.some(e => !e.dead && !e.reachedEnd && Math.hypot(e.x - d.x, e.y - d.y) < DEFENSE_TOWER_BITE_RANGE);
    if (hasBiter) {
      const bitePulse = 0.5 + 0.5 * Math.sin(t * 15);
      ctx.beginPath(); ctx.arc(d.x, d.y, 26 + bitePulse * 3, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(239, 68, 68, ${0.4 + bitePulse * 0.5})`; ctx.lineWidth = 2; ctx.stroke();
    }
  }
}

function drawSuicideCannons() {
  for (const s of game.suicideCannons) {
    const t = game.time;
    const urgency = Math.max(0, 1 - s.countdown / SUICIDE_CANNON_COUNTDOWN);
    const pulseSpeed = 8 + urgency * 25;
    const pulse = 0.5 + 0.5 * Math.sin(t * pulseSpeed);
    ctx.beginPath(); ctx.arc(s.x, s.y, SUICIDE_CANNON_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(239, 68, 68, ${0.15 + urgency * 0.35})`;
    ctx.lineWidth = 1.5; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(s.x, s.y, SUICIDE_CANNON_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(239, 68, 68, ${0.03 + urgency * 0.07})`; ctx.fill();
    ctx.beginPath(); ctx.arc(s.x, s.y, 24 + pulse * 8, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(239, 68, 68, ${0.4 + pulse * 0.5})`; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y, 18 + pulse * 5, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(251, 146, 60, ${0.3 + pulse * 0.4})`; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#2a0e14'; ctx.fill();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.save(); ctx.shadowBlur = 12 + pulse * 10; ctx.shadowColor = '#ef4444';
    ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(239, 68, 68, ${0.5 + pulse * 0.5})`; ctx.fill(); ctx.restore();
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fef2f2'; ctx.fillText('💥', s.x, s.y + 1);
    const secs = Math.max(0, s.countdown).toFixed(1);
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.strokeStyle = '#0a0508'; ctx.lineWidth = 4;
    ctx.strokeText(secs + 's', s.x, s.y - 34);
    let countColor;
    if (s.countdown > 2) countColor = '#fbbf24';
    else if (s.countdown > 1) countColor = '#fb923c';
    else countColor = '#ef4444';
    ctx.fillStyle = countColor;
    ctx.fillText(secs + 's', s.x, s.y - 34);
    if (game.selectedSuicide === s) {
      ctx.beginPath(); ctx.arc(s.x, s.y, 26, 0, Math.PI * 2);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }
}

function drawMines() {
  for (const m of game.mines) {
    const t = game.time;
    const breathe = 0.5 + 0.5 * Math.sin(t * 2.2 + m.x * 0.01);
    ctx.beginPath(); ctx.arc(m.x, m.y, MINE_TRIGGER_RADIUS + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(249, 115, 22, ${0.12 + breathe * 0.15})`;
    ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.ellipse(m.x, m.y + 3, 16, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.beginPath(); ctx.arc(m.x, m.y + 2, 11, Math.PI, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = '#3a1810'; ctx.fill();
    ctx.strokeStyle = '#7f3218'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y + 2, 8, Math.PI, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = '#5a2614'; ctx.fill();
    ctx.strokeStyle = '#a3471e'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.shadowBlur = 8 + breathe * 10; ctx.shadowColor = '#ef4444';
    ctx.beginPath(); ctx.arc(m.x, m.y - 1, 3 + breathe * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(239, 68, 68, ${0.7 + breathe * 0.3})`; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(m.x, m.y - 4); ctx.lineTo(m.x, m.y - 8);
    ctx.strokeStyle = '#7f3218'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y - 9, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(251, 146, 60, ${0.6 + breathe * 0.4})`; ctx.fill();
    if (game.selectedMine === m) {
      ctx.beginPath(); ctx.arc(m.x, m.y, 24, 0, Math.PI * 2);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }
}

function drawEnemies() {
  for (const e of game.enemies) {
    if (e.slowTimer > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill();
    }
    if (e.poisonTimer > 0) {
      const poisonPulse = 0.5 + 0.5 * Math.sin(game.time * 6);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 5 + poisonPulse * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(163, 230, 53, 0.28)'; ctx.fill();
      ctx.strokeStyle = `rgba(163, 230, 53, ${0.5 + poisonPulse * 0.3})`; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = e.color; ctx.fill();
    ctx.lineWidth = e.boss ? 3 : 2;
    ctx.strokeStyle = e.boss ? '#ffffff' : 'rgba(0,0,0,0.45)'; ctx.stroke();
    if (e.bitingDefense && !e.bitingDefense.dead) {
      const angerPulse = 0.5 + 0.5 * Math.sin(game.time * 12);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 5 + angerPulse * 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(239, 68, 68, ${0.6 + angerPulse * 0.4})`; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(e.x - e.radius * 0.3, e.y - e.radius * 0.2, e.radius * 0.22, 0, Math.PI * 2);
    ctx.arc(e.x + e.radius * 0.3, e.y - e.radius * 0.2, e.radius * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#0b1220'; ctx.fill();
    const bw = e.radius * 2.6, bh = 5;
    const bx = e.x - bw / 2, by = e.y - e.radius - 13;
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = ratio > 0.5 ? '#4ade80' : ratio > 0.25 ? '#facc15' : '#ef4444';
    ctx.fillRect(bx, by, bw * ratio, bh);
  }
}

function drawProjectiles() {
  for (const p of game.projectiles) {
    if (p.isSniper) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 1, 0, Math.PI * 2);
      ctx.fillStyle = '#f5f3ff'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(192, 132, 252, 0.45)'; ctx.fill();
      continue;
    }
    if (p.isPoison) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 2, 0, Math.PI * 2);
      ctx.fillStyle = '#a3e635'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(163, 230, 53, 0.35)'; ctx.fill();
      continue;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color + '33'; ctx.fill();
  }
}

function drawBeams() {
  for (const b of game.beams) {
    const a = Math.max(0, b.life / b.maxLife);
    const w = b.width || 7;
    ctx.strokeStyle = b.color + Math.round(a * 90).toString(16).padStart(2, '0');
    ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (a * 0.9) + ')';
    ctx.lineWidth = Math.max(1, w * 0.25);
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of game.particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDamageNumbers() {
  for (const dn of game.damageNumbers) {
    const a = Math.max(0, dn.life / dn.maxLife);
    ctx.globalAlpha = a;
    ctx.font = `bold ${dn.size}px "Courier New", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3;
    ctx.strokeText(dn.value, dn.x, dn.y);
    ctx.fillStyle = dn.color; ctx.fillText(dn.value, dn.x, dn.y);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  if (!game) return;
  ctx.fillStyle = game.mode === 'op' ? '#120b02' : '#0b1220';
  ctx.fillRect(0, 0, W, H);
  drawGrid(); drawPath(); drawCastle();
  drawMines();
  if (game.selectedTower) {
    const t = game.selectedTower;
    drawRange(t.x, t.y, TOWER_TYPES[t.type].range, '#fbbf24');
  }
  if (game.selectedTowerType && game.mouse) {
    if (game.selectedTowerType === 'defense') {
      const cost = getTowerCost('defense');
      const ok = canPlaceDefense(game.mouse.x, game.mouse.y) && game.gold >= cost;
      const col = ok ? '#4ade80' : '#ef4444';
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, 24, 0, Math.PI * 2);
      ctx.fillStyle = col + '18'; ctx.fill();
      ctx.strokeStyle = col + 'aa'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(game.mouse.x, game.mouse.y); ctx.rotate(game.time * 0.8);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const r = 24;
        const px = Math.cos(angle) * r, py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.strokeStyle = col + '99'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.7; ctx.fillText('🛡️', game.mouse.x, game.mouse.y + 1); ctx.globalAlpha = 1;
    } else if (game.selectedTowerType === 'suicide') {
      const cost = getTowerCost('suicide');
      const ok = canPlaceSuicide(game.mouse.x, game.mouse.y) && game.gold >= cost;
      const col = ok ? '#ef4444' : '#64748b';
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, SUICIDE_CANNON_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = col + 'aa'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, SUICIDE_CANNON_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = col + '18'; ctx.fill();
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, 16, 0, Math.PI * 2);
      ctx.fillStyle = ok ? 'rgba(239,68,68,0.6)' : 'rgba(100,116,139,0.5)'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fef2f2'; ctx.fillText('💥', game.mouse.x, game.mouse.y + 1);
    } else if (game.selectedTowerType === 'mine') {
      const cost = getTowerCost('mine');
      const ok = canPlaceMine(game.mouse.x, game.mouse.y) && game.gold >= cost;
      const col = ok ? '#f97316' : '#64748b';
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, MINE_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = col + '88'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, MINE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = col + '12'; ctx.fill();
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, MINE_TRIGGER_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = col + 'cc'; ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 5]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, 11, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = ok ? 'rgba(249,115,22,0.7)' : 'rgba(100,116,139,0.5)'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff7ed'; ctx.fillText('🧨', game.mouse.x, game.mouse.y - 2);
    } else {
      const def = TOWER_TYPES[game.selectedTowerType];
      const unlocked = isTowerUnlocked(game.selectedTowerType);
      const cost = getTowerCost(game.selectedTowerType);
      const ok = canPlaceNormal(game.mouse.x, game.mouse.y) && game.gold >= cost && unlocked;
      const col = ok ? '#4ade80' : '#ef4444';
      drawRange(game.mouse.x, game.mouse.y, def.range, col);
      ctx.globalAlpha = 0.65;
      ctx.beginPath(); ctx.arc(game.mouse.x, game.mouse.y, 15, 0, Math.PI * 2);
      ctx.fillStyle = ok ? def.color : '#ef4444'; ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  drawTowers(); drawDefenses(); drawSuicideCannons(); drawEnemies();
  drawProjectiles(); drawBeams(); drawParticles(); drawDamageNumbers();
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD() {
  if (!game) return;
  livesEl.textContent = game.lives;
  goldEl.textContent = Math.floor(game.gold);
  waveEl.textContent = game.wave;
  maxWaveEl.textContent = isInfiniteMode() ? '∞' : game.level.waveCount;

  if (game.state === 'paused') { waveStatusEl.textContent = '已暂停'; startBtn.disabled = true; }
  else if (game.state !== 'playing') { waveStatusEl.textContent = game.state === 'won' ? '守城成功！' : '防线失守…'; startBtn.disabled = true; }
  else if (game.waveActive) {
    const remain = game.enemies.length + game.spawnQueue.length;
    waveStatusEl.textContent = `第 ${game.wave} 波 · 剩 ${remain}`;
    startBtn.disabled = true;
  } else {
    const nextWave = game.wave + 1;
    if (isInfiniteMode() || nextWave <= game.level.waveCount) {
      const cfg = waveConfig(nextWave);
      const bossTag = cfg.boss ? ' ⚠️Boss' : '';
      waveStatusEl.textContent = `下一波(${cfg.count}只${bossTag}):${Math.ceil(game.betweenTimer)}s`;
    } else {
      waveStatusEl.textContent = `下一波：${Math.ceil(game.betweenTimer)}s`;
    }
    startBtn.disabled = false;
  }

  for (const btn of shopEl.children) {
    const typeKey = btn.dataset.type;
    if (!typeKey) continue;
    const cost = getTowerCost(typeKey);
    btn.classList.toggle('poor', game.gold < cost);
  }
}

/* =========================================================
   商店
   ========================================================= */
function buildShop() {
  shopEl.innerHTML = '';

  const isOp = game.mode === 'op';

  /* 防御炮台 */
  const defBtn = document.createElement('button');
  defBtn.className = 'tower-btn defense-type' + (isOp ? ' op-tower' : '');
  defBtn.dataset.type = 'defense';
  const defCost = getTowerCost('defense');
  const defHp = getDefenseMaxHp();
  const defDesc = isOp ? `扛 ${defHp} 血 · 啃 ${Math.round(defHp / OP_MODE_BITE_RATE)} 秒` : DEFENSE_TOWER_TYPE.desc;
  defBtn.innerHTML = `<span class="tb-icon">${DEFENSE_TOWER_TYPE.icon}</span><span class="tb-info"><b>${DEFENSE_TOWER_TYPE.name}</b><small>${defDesc}</small></span><span class="tb-cost">🪙${defCost}</span>`;
  defBtn.addEventListener('click', () => {
    if (game.state !== 'playing') return;
    game.selectedTower = null; game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
    game.selectedTowerType = game.selectedTowerType === 'defense' ? null : 'defense';
    updateShopUI(); updateTowerPanel();
  });
  shopEl.appendChild(defBtn);

  if (game.mode !== 'defense') {
    /* 炸弹 */
    const suiBtn = document.createElement('button');
    suiBtn.className = 'tower-btn suicide-type' + (isOp ? ' op-tower' : '');
    suiBtn.dataset.type = 'suicide';
    const suiCost = getTowerCost('suicide');
    suiBtn.innerHTML = `<span class="tb-icon">${SUICIDE_CANNON_TYPE.icon}</span><span class="tb-info"><b>${SUICIDE_CANNON_TYPE.name}</b><small>${SUICIDE_CANNON_TYPE.desc}</small></span><span class="tb-cost">🪙${suiCost}</span>`;
    suiBtn.addEventListener('click', () => {
      if (game.state !== 'playing') return;
      game.selectedTower = null; game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
      game.selectedTowerType = game.selectedTowerType === 'suicide' ? null : 'suicide';
      updateShopUI(); updateTowerPanel();
    });
    shopEl.appendChild(suiBtn);

    /* 地雷 */
    const mineBtn = document.createElement('button');
    mineBtn.className = 'tower-btn mine-type' + (isOp ? ' op-tower' : '');
    mineBtn.dataset.type = 'mine';
    const mineCost = getTowerCost('mine');
    mineBtn.innerHTML = `<span class="tb-icon">${MINE_TYPE.icon}</span><span class="tb-info"><b>${MINE_TYPE.name}</b><small>${MINE_TYPE.desc}</small></span><span class="tb-cost">🪙${mineCost}</span>`;
    mineBtn.addEventListener('click', () => {
      if (game.state !== 'playing') return;
      game.selectedTower = null; game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
      game.selectedTowerType = game.selectedTowerType === 'mine' ? null : 'mine';
      updateShopUI(); updateTowerPanel();
    });
    shopEl.appendChild(mineBtn);
  }

  if (game.mode !== 'defense') {
    Object.values(TOWER_TYPES).forEach(def => {
      const unlocked = isTowerUnlocked(def.key);
      const isBanned = (game.mode === 'random' || game.mode === 'limit')
        && game.bannedTowers && game.bannedTowers.includes(def.key);

      const btn = document.createElement('button');
      let cls = 'tower-btn';
      if (isOp) cls += ' op-tower';
      if (isBanned) cls += ' banned';
      else if (!unlocked) cls += ' locked';
      btn.className = cls;

      const cost = getTowerCost(def.key);

      if (isBanned) {
        btn.innerHTML = `<span class="tb-icon">${def.icon}</span><span class="tb-info"><b>${def.name}</b><small>本波被禁用</small></span><span class="tb-cost">🚫</span>`;
      } else if (unlocked) {
        btn.dataset.type = def.key;
        const nameExtra = isOp ? '<span class="tb-op-badge">满级</span>' : '';
        btn.innerHTML = `<span class="tb-icon">${def.icon}</span><span class="tb-info"><b>${def.name}${nameExtra}</b><small>${def.desc}</small></span><span class="tb-cost">🪙${cost}</span>`;
        btn.addEventListener('click', () => {
          if (game.state !== 'playing') return;
          game.selectedTower = null; game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
          game.selectedTowerType = game.selectedTowerType === def.key ? null : def.key;
          updateShopUI(); updateTowerPanel();
        });
      } else {
        btn.innerHTML = `<span class="tb-icon">🔒</span><span class="tb-info"><b>???</b><small>通关前置关卡解锁</small></span><span class="tb-cost">—</span>`;
      }
      shopEl.appendChild(btn);
    });
  }
}

function updateShopUI() {
  for (const btn of shopEl.children) {
    if (btn.dataset.type) btn.classList.toggle('active', btn.dataset.type === game.selectedTowerType);
  }
}

/* =========================================================
   塔面板
   ========================================================= */
let lastPanelSig = '';

function updateTowerPanel() {
  if (!game) return;
  const isOp = game.mode === 'op';

  const m = game.selectedMine;
  if (m && game.state === 'playing') {
    const sig = `MINE|${Math.floor(game.gold)}`;
    if (sig === lastPanelSig) return;
    lastPanelSig = sig;
    towerPanelEl.classList.remove('hidden');
    towerPanelEl.innerHTML = `
      <div class="tp-head"><span style="color:${MINE_TYPE.color}">🧨 ${MINE_TYPE.name}</span><button id="tpClose">✕</button></div>
      <div class="tp-mine-status"><span class="label">状态</span><span class="value">⏳ 等待触发</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>爆炸伤害</span><span class="hp-val" style="color:#ef4444;">${MINE_DAMAGE}</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>爆炸半径</span><span class="hp-val" style="color:#fb923c;">${MINE_RADIUS}px</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>触发距离</span><span class="hp-val" style="color:#f97316;">${MINE_TRIGGER_RADIUS}px</span></div>
      <button class="tp-sell" data-sell-mine>拆除 · 返还 🪙${Math.floor(m.invested * 0.5)}</button>
      <div class="tp-defense-note">🧨 敌人踩到即爆 · 一次性</div>
    `;
    towerPanelEl.querySelector('#tpClose').onclick = () => { game.selectedMine = null; lastPanelSig = ''; };
    const sellMineBtn = towerPanelEl.querySelector('[data-sell-mine]');
    if (sellMineBtn) sellMineBtn.onclick = () => sellMine(m);
    return;
  }

  const s = game.selectedSuicide;
  if (s && game.state === 'playing') {
    const sig = `SUI|${s.countdown.toFixed(1)}|${Math.floor(game.gold)}`;
    if (sig === lastPanelSig) return;
    lastPanelSig = sig;
    towerPanelEl.classList.remove('hidden');
    towerPanelEl.innerHTML = `
      <div class="tp-head"><span style="color:${SUICIDE_CANNON_TYPE.color}">💥 ${SUICIDE_CANNON_TYPE.name}</span><button id="tpClose">✕</button></div>
      <div class="tp-suicide-count"><span class="label">引爆倒计时</span><span class="count">${Math.max(0, s.countdown).toFixed(1)}s</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>爆炸伤害</span><span class="hp-val" style="color:#ef4444;">${SUICIDE_CANNON_DAMAGE}</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>爆炸半径</span><span class="hp-val" style="color:#fb923c;">${SUICIDE_CANNON_RADIUS}px</span></div>
      <div class="tp-defense-note warn">⚠️ 即将爆炸 · 无法取消</div>
    `;
    towerPanelEl.querySelector('#tpClose').onclick = () => { game.selectedSuicide = null; lastPanelSig = ''; };
    return;
  }

  const d = game.selectedDefense;
  if (d && game.state === 'playing') {
    const sig = `DEF|${Math.ceil(d.hp)}|${d.bitten ? 1 : 0}|${Math.floor(game.gold)}|${d.maxHp}`;
    if (sig === lastPanelSig) return;
    lastPanelSig = sig;
    const hpRatio = Math.max(0, d.hp / d.maxHp);
    let hpClass = '';
    if (hpRatio <= 0.3) hpClass = 'crit';
    else if (hpRatio <= 0.6) hpClass = 'low';
    towerPanelEl.classList.remove('hidden');
    let sellBlock = '';
    if (d.bitten) sellBlock = `<div class="tp-defense-note warn">⚠️ 已被啃咬，无法出售</div>`;
    else sellBlock = `<button class="tp-sell" data-sell-defense>出售 · 返还 🪙${Math.floor(d.invested * DEFENSE_TOWER_SELL_RATIO)}</button>`;
    const biteRate = getDefenseBiteRate();
    towerPanelEl.innerHTML = `
      <div class="tp-head"><span style="color:${DEFENSE_TOWER_TYPE.color}">🛡️ ${DEFENSE_TOWER_TYPE.name}${isOp ? ' · 爽' : ''}</span><button id="tpClose">✕</button></div>
      <div class="tp-defense-hp ${hpClass}"><span>剩余生命</span><span class="hp-val">${Math.ceil(d.hp)} / ${d.maxHp}</span></div>
      <div class="tp-defense-hp" style="margin-top:0;background:#0a0e18;"><span>啃咬速率</span><span class="hp-val" style="color:#f87171;">${biteRate} 次/秒</span></div>
      ${sellBlock}
      <div class="tp-defense-note">🛡️ 建在路径上阻挡怪物 · 无攻击能力</div>
    `;
    towerPanelEl.querySelector('#tpClose').onclick = () => { game.selectedDefense = null; lastPanelSig = ''; };
    const sellDefBtn = towerPanelEl.querySelector('[data-sell-defense]');
    if (sellDefBtn) sellDefBtn.onclick = () => sellDefense(d);
    return;
  }

  const t = game.selectedTower;
  if (!t || game.state !== 'playing') {
    if (!towerPanelEl.classList.contains('hidden')) { towerPanelEl.classList.add('hidden'); lastPanelSig = ''; }
    return;
  }
  const sig = `${t.type}|${t.dmgLvl}|${t.rateLvl}|${Math.floor(game.gold)}|${t.invested}|${t.fixed ? 1 : 0}|${game.demonPactUsed ? 1 : 0}|${game.demonPactTimer > 0 ? Math.ceil(game.demonPactTimer) : 0}|${game.wave}`;
  if (sig === lastPanelSig) return;
  lastPanelSig = sig;
  const def = TOWER_TYPES[t.type];
  const dmgCost = upgradeCost(t, 'dmg');
  const rateCost = upgradeCost(t, 'rate');
  towerPanelEl.classList.remove('hidden');

  /* 爽模式：显示塔的金色标记，不显示升级按钮 */
  let opBlock = '';
  if (isOp) {
    opBlock = `<div class="tp-op-tag">🔥 爽模式 · 建造即满级 · 伤害随波数暴增</div>`;
  }

  let demonBlock = '';
  if (isOp) {
    demonBlock = `<div class="tp-demon-locked">🔥 爽模式无需恶魔契约</div>`;
  } else if (!isDemonPactAvailable()) {
    demonBlock = `<div class="tp-demon-locked">🔒 该模式无法使用恶魔契约</div>`;
  } else if (!game.demonPactUsed) {
    demonBlock = `<button class="tp-demon" data-demon ${game.gold < DEMON_PACT_COST ? 'disabled' : ''}>😈 恶魔契约 · 🪙${DEMON_PACT_COST}<small>全塔满级 ${DEMON_PACT_DURATION}秒 · 每局限一次</small></button>`;
  } else if (game.demonPactTimer > 0) {
    demonBlock = `<div class="tp-demon-active">😈 契约生效中 · ${Math.ceil(game.demonPactTimer)}s</div>`;
  }

  /* 爽模式：不显示升级按钮 */
  const upgradeBlock = isOp ? '' : `
    <div class="tp-row"><span>伤害 Lv.${t.dmgLvl}</span>${t.dmgLvl >= MAX_LEVEL ? '<span class="maxed">已满级</span>' : `<button class="up" data-k="dmg" ${game.gold < dmgCost ? 'disabled' : ''}>升级 🪙${dmgCost}</button>`}</div>
    <div class="tp-row"><span>射速 Lv.${t.rateLvl}</span>${t.rateLvl >= MAX_LEVEL ? '<span class="maxed">已满级</span>' : `<button class="up" data-k="rate" ${game.gold < rateCost ? 'disabled' : ''}>升级 🪙${rateCost}</button>`}</div>
  `;

  towerPanelEl.innerHTML = `
    <div class="tp-head"><span style="color:${def.color}">${def.icon} ${def.name}${t.fixed ? ' · 城堡' : ''}${isOp ? ' · 满级' : ''}</span><button id="tpClose">✕</button></div>
    ${upgradeBlock}
    <div class="tp-row" style="color:#7f92b0;font-size:11px;margin-top:6px;"><span>伤害 ${formatNumber(towerDamage(t))}</span><span>射速 ${towerFireRate(t).toFixed(2)}/s</span></div>
    ${t.fixed ? '<div class="tp-fixed">🏰 城堡固定塔 · 不可出售</div>' : `<button class="tp-sell" data-sell>出售 · 返还 🪙${Math.floor(t.invested * 0.6)}</button>`}
    ${opBlock}
    ${demonBlock}
  `;
  towerPanelEl.querySelector('#tpClose').onclick = () => { game.selectedTower = null; lastPanelSig = ''; };
  towerPanelEl.querySelectorAll('.up').forEach(b => { b.onclick = () => doUpgrade(t, b.dataset.k); });
  const sellBtn = towerPanelEl.querySelector('[data-sell]');
  if (sellBtn) sellBtn.onclick = () => sellTower(t);
  const demonBtn = towerPanelEl.querySelector('[data-demon]');
  if (demonBtn) demonBtn.onclick = () => useDemonPact(t);
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer = null;
function showToast(msg, ok = false) {
  toastEl.textContent = msg;
  toastEl.style.background = ok ? 'rgba(34, 197, 94, .92)' : 'rgba(220, 60, 60, .92)';
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
}

/* =========================================================
   结算浮层
   ========================================================= */
function showOverlay(won) {
  overlayEl.classList.remove('hidden');
  pointerDownPos = null; pointerDownTime = 0;
  pauseMaskEl.classList.add('hidden');
  pauseBtn.textContent = '⏸'; pauseBtn.classList.remove('active');
  const level = game.level;

  if (game.mode === 'op') {
    ovTitleEl.textContent = '🔥 爽完了';
    ovTitleEl.className = 'op-title';
    const best = Math.max(progress.opBest, game.wave);
    ovDescEl.innerHTML = `爽就完了 · 你在第 ${game.wave} 波被击溃<br>最佳记录：第 ${best} 波 🏆`;
    onSpecialModeGameOver();
    startBtn.disabled = true;
    return;
  }

  if (game.mode === 'endless') {
    if (won) {
      ovTitleEl.textContent = '∞ 无尽通关';
      ovTitleEl.className = 'endless-title';
      ovDescEl.innerHTML = `无尽模式 · 撑过第 ${game.wave} 波<br>这不应该发生，你太强了`;
    } else {
      ovTitleEl.textContent = '∞ 无尽结束';
      ovTitleEl.className = 'endless-title';
      const best = Math.max(progress.endlessBest, game.wave);
      ovDescEl.innerHTML = `无尽模式 · 你在第 ${game.wave} 波被击溃<br>最高记录：第 ${best} 波 🏆`;
      onSpecialModeGameOver();
    }
    startBtn.disabled = true;
    return;
  }

  if (game.mode === 'defense') {
    ovTitleEl.textContent = '🛡️ 生存赛结束';
    ovTitleEl.className = 'mode-title';
    const best = Math.max(progress.defenseBest, game.wave);
    ovDescEl.innerHTML = `防御炮台生存赛 · 你在第 ${game.wave} 波被击溃<br>最高记录：第 ${best} 波 🏆`;
    onSpecialModeGameOver();
    startBtn.disabled = true;
    return;
  }

  if (game.mode === 'limit' || game.mode === 'random') {
    const modeName = game.mode === 'limit' ? '🚫 塔限制挑战' : '🎲 随机禁用塔';
    if (won) {
      ovTitleEl.textContent = modeName + ' · 通关';
      ovTitleEl.className = 'mode-title';
      ovDescEl.innerHTML = `第 ${level.id} 关 · ${level.name}<br>剩余生命 ${game.lives} ❤️`;
    } else {
      ovTitleEl.textContent = modeName + ' · 失败';
      ovTitleEl.className = 'mode-title';
      const best = game.mode === 'limit' ? Math.max(progress.limitBest, game.wave) : Math.max(progress.randomBest, game.wave);
      ovDescEl.innerHTML = `第 ${level.id} 关 · ${level.name}<br>你在第 ${game.wave} 波被击溃<br>最佳：第 ${best} 波`;
    }
    onSpecialModeGameOver();
    startBtn.disabled = true;
    return;
  }

  ovTitleEl.textContent = won ? '🏆 守城成功！' : '💀 游戏结束';
  ovTitleEl.className = won ? 'win' : 'lose';
  const nextLevel = LEVELS.find(l => l.id === level.id + 1);
  let desc = '';
  if (won) {
    desc = `第 ${level.id} 关 · ${level.name}<br>剩余生命 ${game.lives} ❤️`;
    if (level.unlockTower) {
      const tDef = TOWER_TYPES[level.unlockTower];
      desc += `<br><span style="color:#5eead4">🎉 解锁新塔：${tDef.icon} ${tDef.name}</span>`;
    }
    if (nextLevel) desc += `<br><span style="color:#93a5c4">已解锁第 ${nextLevel.id} 关</span>`;
    else desc += `<br><span style="color:#fbbf24">🏆 全部关卡通关！</span>`;
  } else {
    desc = `第 ${level.id} 关 · ${level.name}<br>你在第 ${game.wave} 波被击溃了<br>最终金币 ${Math.floor(game.gold)} 🪙`;
  }
  ovDescEl.innerHTML = desc;
  startBtn.disabled = true;
}

/* =========================================================
   输入
   ========================================================= */
function getCanvasPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) * (canvas.width / r.width), y: (clientY - r.top) * (canvas.height / r.height) };
}

let pointerDownPos = null;
let pointerDownTime = 0;

function onPointerDown(e) {
  if (!game || game.state !== 'playing') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const pt = getCanvasPoint(e.clientX, e.clientY);
  game.mouse = pt;
  pointerDownPos = pt;
  pointerDownTime = performance.now();
  if (e.pointerType === 'touch') e.preventDefault();
}

function onPointerMove(e) {
  if (!game) return;
  const pt = getCanvasPoint(e.clientX, e.clientY);
  game.mouse = pt;
  if (e.pointerType === 'touch') e.preventDefault();
}

function onPointerUp(e) {
  if (!game || game.state !== 'playing') return;
  const pt = getCanvasPoint(e.clientX, e.clientY);
  game.mouse = pt;
  const dt = performance.now() - pointerDownTime;
  const moved = pointerDownPos ? Math.hypot(pt.x - pointerDownPos.x, pt.y - pointerDownPos.y) : 0;
  pointerDownPos = null;
  if (moved > 18 || dt > 700) return;
  if (game.selectedTowerType) { tryPlace(pt.x, pt.y); return; }

  let foundMine = null;
  for (const m of game.mines) if (Math.hypot(m.x - pt.x, m.y - pt.y) < 22) { foundMine = m; break; }
  if (foundMine) { game.selectedMine = foundMine; game.selectedSuicide = null; game.selectedDefense = null; game.selectedTower = null; lastPanelSig = ''; return; }

  let foundSuicide = null;
  for (const s of game.suicideCannons) if (Math.hypot(s.x - pt.x, s.y - pt.y) < 26) { foundSuicide = s; break; }
  if (foundSuicide) { game.selectedSuicide = foundSuicide; game.selectedDefense = null; game.selectedTower = null; game.selectedMine = null; lastPanelSig = ''; return; }

  let foundDefense = null;
  for (const d of game.defenses) if (Math.hypot(d.x - pt.x, d.y - pt.y) < 26) { foundDefense = d; break; }
  if (foundDefense) { game.selectedDefense = foundDefense; game.selectedTower = null; game.selectedSuicide = null; game.selectedMine = null; lastPanelSig = ''; return; }

  let foundTower = null;
  for (const t of game.towers) if (Math.hypot(t.x - pt.x, t.y - pt.y) < 24) { foundTower = t; break; }
  game.selectedTower = foundTower;
  game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
  lastPanelSig = '';
}

function onPointerCancel() { pointerDownPos = null; }

if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('pointerleave', onPointerCancel);
} else {
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; if (!t) return;
    onPointerDown({ clientX: t.clientX, clientY: t.clientY, pointerType: 'touch', preventDefault: () => e.preventDefault() });
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0]; if (!t) return;
    onPointerMove({ clientX: t.clientX, clientY: t.clientY, pointerType: 'touch', preventDefault: () => e.preventDefault() });
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0]; if (!t) return;
    onPointerUp({ clientX: t.clientX, clientY: t.clientY, pointerType: 'touch' });
  }, { passive: false });
  canvas.addEventListener('touchcancel', onPointerCancel);
}

canvas.addEventListener('mouseleave', () => { if (!game) return; game.mouse = null; pointerDownPos = null; });
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!game) return;
  game.selectedTowerType = null; game.selectedTower = null;
  game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
  updateShopUI(); lastPanelSig = '';
});
canvas.addEventListener('dblclick', e => { e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', e => {
  if (!game) return;
  if (e.key === 'Escape') {
    game.selectedTowerType = null; game.selectedTower = null;
    game.selectedDefense = null; game.selectedSuicide = null; game.selectedMine = null;
    updateShopUI(); lastPanelSig = '';
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (game.state === 'playing' && !game.waveActive) game.betweenTimer = 0;
  }
  if (e.code === 'KeyP') { e.preventDefault(); togglePause(); }
});

startBtn.addEventListener('click', () => {
  if (game && game.state === 'playing' && !game.waveActive) game.betweenTimer = 0;
});
pauseBtn.addEventListener('click', togglePause);
speedBtn.addEventListener('click', toggleSpeed);
soundBtn.addEventListener('click', toggleSound);

pauseResumeBtn.addEventListener('click', () => { if (game && game.state === 'paused') togglePause(); });

pauseSaveExitBtn.addEventListener('click', () => {
  if (!game) return;
  if (game.mode !== 'endless') { showToast('只有无尽模式支持存档'); return; }
  const ok = saveEndlessGame();
  if (ok) {
    sfxSave();
    showToast('💾 存档成功 · 第 ' + game.wave + ' 波', true);
    setTimeout(() => { showEndlessScreen(); }, 400);
  } else showToast('存档失败，请重试');
});

pauseQuitExitBtn.addEventListener('click', () => {
  if (!game) return;
  if (game.mode === 'endless') {
    if (!confirm('确定放弃当前进度并退出吗？未保存的进度会丢失。')) return;
  } else {
    if (!confirm('确定要退出当前游戏吗？')) return;
  }
  if (game.mode !== 'normal') onSpecialModeGameOver();
  showMenu();
});

backToMenuBtn.addEventListener('click', () => {
  if (!game) { showMenu(); return; }
  if (game.state === 'playing' || game.state === 'paused') {
    if (game.mode === 'endless') {
      if (!confirm('当前无尽模式进度未保存，退出会丢失。确定退出吗？')) return;
    } else {
      if (!confirm('确定要退出当前游戏吗？')) return;
    }
  }
  if (game.mode !== 'normal' && game.state !== 'won' && game.state !== 'lost') {
    onSpecialModeGameOver();
  }
  showMenu();
});

restartBtn.addEventListener('click', () => {
  if (!game) return;
  const mode = game.mode;
  const levelId = game.level.id;
  if (mode === 'endless') startEndlessMode();
  else if (mode === 'limit' || mode === 'random' || mode === 'defense' || mode === 'op') startSpecialMode(mode);
  else startLevel(levelId);
});

menuBtn.addEventListener('click', () => { showMenu(); });

resetProgressBtn.addEventListener('click', () => {
  if (confirm('确定要重置所有关卡进度吗？（不会删除无尽模式存档）')) {
    progress.unlockedLevel = 1;
    progress.completed = {};
    progress.endlessBest = 0;
    progress.endlessMaxGold = 0;
    progress.limitBest = 0;
    progress.randomBest = 0;
    progress.defenseBest = 0;
    progress.opBest = 0;
    saveProgress();
    renderLevelGrid();
  }
});

endlessModeBtn.addEventListener('click', () => { showEndlessScreen(); });
moreModesBtn.addEventListener('click', () => { showModesScreen(); });
backToMenuFromModes.addEventListener('click', () => { showMenu(); });
backToMenuFromEndless.addEventListener('click', () => { showMenu(); });

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();

function loop(now) {
  const rawDt = (now - lastTime) / 1000;
  const baseDt = Math.min(0.1, rawDt);
  const dt = baseDt * (settings.speedMultiplier || 1);
  lastTime = now;
  if (currentScreen === 'game' && game) {
    update(dt);
    draw();
    updateHUD();
    updateTowerPanel();
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   启动
   ========================================================= */
loadProgress();
updateSpeedButton();
updateSoundButton();
renderLevelGrid();
requestAnimationFrame(loop);
</script>
</body>
</html>
