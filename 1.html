<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>塔防 · 关卡模式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

  html, body {
    background: radial-gradient(circle at 50% 0%, #16213a 0%, #070b14 70%);
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e2e8f0;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 8px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .hidden { display: none !important; }

  /* ============ 主菜单 ============ */
  .menu-screen { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .menu-header { text-align: center; padding: 8px 0 2px; }
  .menu-header h1 {
    font-size: 28px; letter-spacing: 2px;
    background: linear-gradient(180deg, #5eead4, #22d3ee 60%, #818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(34,211,238,.25); margin-bottom: 6px;
  }
  .menu-header p { color: #93a5c4; font-size: 13px; letter-spacing: 1px; }
  .level-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .level-card {
    position: relative; display: flex; flex-direction: column; gap: 6px;
    padding: 14px 16px; background: linear-gradient(180deg, #1a2438, #111a2b);
    border: 1px solid #2c3c5a; border-radius: 12px; cursor: pointer;
    transition: all .16s ease; text-align: left; color: #cbd5e1;
    font-family: inherit; overflow: hidden;
  }
  .level-card:active:not(.locked) { transform: scale(.985); border-color: #4b6a9c; }
  .level-card.locked { cursor: not-allowed; opacity: .5; }
  .level-card.locked::after { content: '🔒'; position: absolute; right: 14px; top: 14px; font-size: 18px; opacity: .8; }
  .lc-num { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #64748b; text-transform: uppercase; }
  .lc-name { font-size: 17px; font-weight: 800; color: #e2e8f0; letter-spacing: .5px; }
  .lc-desc { font-size: 12px; color: #7f92b0; line-height: 1.45; }
  .lc-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .lc-stars { font-size: 12px; color: #fbbf24; letter-spacing: 2px; }
  .lc-unlock {
    font-size: 10px; color: #5eead4; background: rgba(94,234,212,.08);
    border: 1px solid rgba(94,234,212,.25); border-radius: 6px;
    padding: 3px 8px; display: inline-block; font-weight: 700;
  }
  .lc-unlock.done { color: #64748b; background: rgba(100,116,139,.08); border-color: rgba(100,116,139,.2); }
  .menu-footer { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 6px 0 10px; flex-wrap: wrap; }
  .btn-ghost {
    padding: 10px 18px; font-size: 13px; font-weight: 700; color: #94a3b8;
    background: transparent; border: 1px solid #33486d; border-radius: 9px;
    cursor: pointer; transition: all .14s; font-family: inherit;
  }
  .btn-ghost:active { color: #f87171; border-color: #7f1d1d; background: rgba(127,29,29,.15); }
  .btn-primary {
    padding: 10px 18px; font-size: 13px; font-weight: 800; border: none;
    border-radius: 9px; cursor: pointer; font-family: inherit;
    transition: transform .14s, filter .14s;
  }
  .btn-primary:active { transform: scale(.96); filter: brightness(1.08); }
  .btn-primary.gold { color: #1a0e00; background: linear-gradient(180deg, #fbbf24, #f59e0b); box-shadow: 0 0 16px rgba(251,191,36,.25); }
  .btn-primary.purple { color: #fff; background: linear-gradient(180deg, #a78bfa, #818cf8); box-shadow: 0 0 16px rgba(167,139,250,.25); }

  /* ============ 无尽/模式页面 ============ */
  .endless-screen, .modes-screen {
    width: 100%; max-width: 560px; display: flex; flex-direction: column;
    gap: 14px; animation: fadeIn .35s ease;
  }
  .endless-header, .modes-header { text-align: center; padding: 8px 0 2px; }
  .endless-header h1 {
    font-size: 30px; letter-spacing: 3px;
    background: linear-gradient(180deg, #fbbf24, #f97316 60%, #ef4444);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(251,191,36,.35); margin-bottom: 6px;
  }
  .endless-header p, .modes-header p { color: #93a5c4; font-size: 13px; letter-spacing: 1px; }
  .modes-header h1 {
    font-size: 26px; letter-spacing: 2px;
    background: linear-gradient(180deg, #a78bfa, #818cf8 60%, #6366f1);
    -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px;
  }

  .endless-record {
    padding: 18px 20px; background: linear-gradient(180deg, #2a1e10, #1a1208);
    border: 1px solid #5c4a1e; border-radius: 14px;
    box-shadow: 0 0 24px rgba(251,191,36,.15), inset 0 1px 0 rgba(251,191,36,.1);
  }
  .er-title { font-size: 11px; font-weight: 800; color: #fbbf24; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; text-align: center; }
  .er-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .er-stat {
    text-align: center; padding: 12px 8px; background: rgba(0,0,0,.28);
    border-radius: 10px; border: 1px solid rgba(251,191,36,.15);
  }
  .er-stat .label { display: block; font-size: 11px; color: #b6a06c; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
  .er-stat .value {
    display: block; font-size: 26px; font-weight: 900; color: #fbbf24;
    font-family: 'Courier New', monospace; letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(251,191,36,.6); line-height: 1.1; word-break: break-all;
  }
  .er-stat .value.small { font-size: 18px; }
  .er-empty { text-align: center; color: #8a7550; font-size: 13px; padding: 8px 0; letter-spacing: .5px; }

  .endless-actions { display: flex; flex-direction: column; gap: 10px; }
  .endless-action-btn {
    display: flex; align-items: center; gap: 12px; padding: 16px 18px;
    background: linear-gradient(180deg, #1a2438, #111a2b);
    border: 1px solid #2c3c5a; border-radius: 12px;
    text-align: left; color: #cbd5e1; font-family: inherit;
    cursor: pointer; transition: all .16s ease;
  }
  .endless-action-btn:active { transform: scale(.985); border-color: #4b6a9c; }
  .endless-action-btn.primary {
    background: linear-gradient(180deg, #3a2a08, #1f1504);
    border-color: #7f5f1d; box-shadow: 0 0 20px rgba(251,191,36,.2);
  }
  .endless-action-btn.primary:active { border-color: #fbbf24; }
  .endless-action-btn.danger:active { border-color: #dc2626; }
  .ea-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
  .ea-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ea-info b { font-size: 15px; color: #e2e8f0; letter-spacing: .3px; }
  .ea-info small { font-size: 12px; color: #7f92b0; line-height: 1.4; }
  .endless-action-btn.danger .ea-info b { color: #fca5a5; }

  /* ============ 更多模式 ============ */
  .mode-list { display: flex; flex-direction: column; gap: 10px; }
  .mode-card {
    display: flex; align-items: center; gap: 12px; padding: 16px 18px;
    background: linear-gradient(180deg, #1a2438, #111a2b);
    border: 1px solid #2c3c5a; border-radius: 12px;
    text-align: left; font-family: inherit; color: #cbd5e1;
    cursor: pointer; transition: all .16s ease;
  }
  .mode-card:active { transform: scale(.985); }
  .mode-card.limit:active { border-color: #f87171; }
  .mode-card.random:active { border-color: #a78bfa; }
  .mode-card.defense:active { border-color: #94a3b8; }
  .mode-card.op:active { border-color: #fbbf24; }
  .mode-card.op {
    background: linear-gradient(180deg, #3a2a08, #1f1504);
    border-color: #7f5f1d;
    box-shadow: 0 0 16px rgba(251,191,36,.15);
  }
  .mode-card.locked { opacity: .55; cursor: not-allowed; }
  .mode-card.locked:active { transform: none; }
  .mc-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .mc-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mc-info b { font-size: 15px; color: #e2e8f0; }
  .mc-info small { font-size: 12px; color: #7f92b0; line-height: 1.4; }
  .mc-status {
    font-size: 10px; font-weight: 700; color: #5eead4;
    background: rgba(94,234,212,.1); border: 1px solid rgba(94,234,212,.3);
    border-radius: 6px; padding: 4px 10px; letter-spacing: .5px; flex-shrink: 0;
  }
  .mode-card.op .mc-status {
    color: #fbbf24; background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.4);
  }
  .mode-card.locked .mc-status {
    color: #64748b; background: #161c2a; border: 1px dashed #334155;
  }
  .modes-footer { display: flex; justify-content: center; padding: 6px 0 8px; }

  /* ============ 游戏界面 ============ */
  .game-screen { width: 100%; max-width: 560px; }
  .game-wrap { display: flex; flex-direction: column; gap: 8px; }
  .hud {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px;
    background: linear-gradient(180deg, #1a2438, #131b2b);
    border: 1px solid #2c3c5a; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.45); flex-wrap: wrap;
  }
  .stat {
    display: flex; align-items: center; gap: 4px; font-size: 14px;
    font-weight: 700; padding: 4px 8px; background: #0e1626;
    border: 1px solid #2a3a58; border-radius: 7px; letter-spacing: .3px;
  }
  .stat .ico { font-size: 13px; }
  #lives { color: #f87171; }
  #gold { color: #fbbf24; }
  #wave { color: #60a5fa; }
  .spacer { flex: 1; }
  .status { font-size: 12px; color: #93a5c4; font-weight: 600; text-align: right; min-width: 100px; padding: 0 4px; }
  .btn-small {
    padding: 8px 12px; font-size: 13px; font-weight: 700;
    color: #06121f; background: linear-gradient(180deg, #5eead4, #22d3ee);
    border: none; border-radius: 8px; cursor: pointer;
    transition: transform .12s, filter .12s; font-family: inherit; min-height: 36px;
  }
  .btn-small:active:not(:disabled) { transform: scale(.96); filter: brightness(1.08); }
  .btn-small:disabled { opacity: .35; cursor: not-allowed; }
  .btn-back {
    padding: 7px 12px; font-size: 13px; font-weight: 700; color: #94a3b8;
    background: #0e1626; border: 1px solid #2a3a58; border-radius: 8px;
    cursor: pointer; transition: all .12s; font-family: inherit; min-height: 36px;
  }
  .btn-back:active { color: #e2e8f0; border-color: #4b6a9c; }
  .btn-ctrl {
    padding: 6px 9px; font-size: 13px; font-weight: 700; color: #cbd5e1;
    background: #0e1626; border: 1px solid #2a3a58; border-radius: 8px;
    cursor: pointer; transition: all .12s; font-family: inherit;
    min-width: 34px; min-height: 36px;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  }
  .btn-ctrl:active { transform: scale(.94); border-color: #4b6a9c; }
  .btn-ctrl.active {
    color: #22d3ee; border-color: #22d3ee;
    background: rgba(34,211,238,.1); box-shadow: 0 0 12px rgba(34,211,238,.25);
  }
  .btn-ctrl.muted { color: #64748b; }

  /* 模式提示条 */
  .mode-banner {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 8px;
    flex-wrap: wrap;
    letter-spacing: .3px;
  }
  .mode-banner.visible { display: flex; }
  .mode-banner.limit { background: linear-gradient(180deg, #2a1010, #1a0808); border: 1px solid #7f1d1d; color: #fca5a5; }
  .mode-banner.random { background: linear-gradient(180deg, #1e1038, #120826); border: 1px solid #5b21b6; color: #c4b5fd; }
  .mode-banner.defense { background: linear-gradient(180deg, #101a24, #08121a); border: 1px solid #334155; color: #94a3b8; }
  .mode-banner.op {
    background: linear-gradient(90deg, #3a2a08, #5a4210, #3a2a08);
    border: 1px solid #fbbf24;
    color: #fef3c7;
    text-shadow: 0 0 8px rgba(251,191,36,.5);
    animation: opGlow 1.5s ease-in-out infinite;
  }
  @keyframes opGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,.4); }
    50% { box-shadow: 0 0 20px rgba(251,191,36,.8); }
  }
  .mode-banner .banned-icon { font-size: 13px; }
  .mode-banner .banned-tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 4px;
    background: rgba(0,0,0,.3); font-size: 10px;
  }

  .canvas-wrap {
    position: relative; width: 100%; aspect-ratio: 960 / 600;
    border-radius: 10px; overflow: hidden;
    border: 1px solid #2c3c5a; box-shadow: 0 8px 32px rgba(0,0,0,.6);
    background: #0b1220; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .pause-mask {
    position: absolute; inset: 0; background: rgba(4, 8, 16, .82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 15;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: fadeIn .2s ease; padding: 16px;
  }
  .pause-mask.hidden { display: none; }
  .pause-icon { font-size: 42px; line-height: 1; }
  .pause-text {
    font-size: 24px; font-weight: 900; color: #5eead4;
    letter-spacing: 6px; text-shadow: 0 0 30px rgba(34,211,238,.7);
  }
  .pause-btns { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px; }
  .pause-action-btn {
    padding: 13px 18px; font-size: 14px; font-weight: 800;
    letter-spacing: .5px; border-radius: 10px; cursor: pointer;
    font-family: inherit; transition: transform .14s, filter .14s;
    border: none; min-height: 46px;
  }
  .pause-action-btn:active { transform: scale(.97); filter: brightness(1.08); }
  .pause-action-btn.primary { color: #06121f; background: linear-gradient(180deg, #5eead4, #22d3ee); }
  .pause-action-btn.save { color: #fbbf24; background: #1a1508; border: 1px solid #5c4a1e; }
  .pause-action-btn.quit { color: #fca5a5; background: #2a0e14; border: 1px solid #7f1d1d; }

  .tower-panel {
    position: absolute; left: 8px; right: 8px; bottom: 8px;
    width: auto; max-width: 260px;
    background: rgba(12, 20, 34, .97);
    border: 1px solid #33486d; border-radius: 9px;
    padding: 9px 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,.7);
    font-size: 12px; z-index: 10;
  }
  .tower-panel.hidden { display: none; }
  .tp-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 13px;
    margin-bottom: 7px; padding-bottom: 6px; border-bottom: 1px solid #26364f;
  }
  #tpClose {
    background: #1a2438; border: 1px solid #33486d; color: #94a3b8;
    cursor: pointer; font-size: 13px; width: 26px; height: 26px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  #tpClose:active { color: #f87171; border-color: #7f1d1d; background: rgba(127,29,29,.2); }
  .tp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #b6c5dc; gap: 6px; }
  .tp-row .up {
    background: linear-gradient(180deg, #34d399, #10b981);
    color: #04121a; border: none; border-radius: 6px;
    padding: 5px 10px; font-weight: 800; font-size: 11px;
    cursor: pointer; font-family: inherit; min-height: 30px;
  }
  .tp-row .up:active:not(:disabled) { filter: brightness(1.12); transform: scale(.96); }
  .tp-row .up:disabled { opacity: .35; cursor: not-allowed; }
  .maxed { color: #fbbf24; font-weight: 700; font-size: 11px; }
  .tp-sell {
    width: 100%; margin-top: 6px; padding: 8px;
    background: #2a1c28; color: #f9a8d4;
    border: 1px solid #5c2a45; border-radius: 7px;
    font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; min-height: 34px;
  }
  .tp-sell:active { background: #3a2233; transform: scale(.98); }
  .tp-fixed {
    width: 100%; margin-top: 6px; padding: 7px;
    background: linear-gradient(180deg, #2a2418, #1d1a12);
    color: #fbbf24; border: 1px solid #5c4a1e; border-radius: 7px;
    font-weight: 700; font-size: 11px; text-align: center; letter-spacing: .5px;
  }
  .tp-defense-hp {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; padding: 5px 8px; background: #0e1626;
    border: 1px solid #2a3a58; border-radius: 6px; font-size: 11px; color: #94a3b8;
  }
  .tp-defense-hp .hp-val { color: #4ade80; font-weight: 800; font-size: 13px; }
  .tp-defense-hp.low .hp-val { color: #facc15; }
  .tp-defense-hp.crit .hp-val { color: #ef4444; }
  .tp-defense-note {
    width: 100%; margin-top: 4px; padding: 6px 8px;
    background: #1a1014; color: #94a3b8;
    border: 1px solid #3a2530; border-radius: 6px;
    font-size: 10px; text-align: center; line-height: 1.4;
  }
  .tp-defense-note.warn { background: #2a0e14; color: #fca5a5; border-color: #7f1d1d; font-weight: 700; }
  .tp-suicide-count {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; padding: 8px 10px;
    background: linear-gradient(180deg, #3a0e14, #1a0508);
    border: 1px solid #7f1d1d; border-radius: 6px;
  }
  .tp-suicide-count .label { font-size: 11px; color: #fca5a5; font-weight: 700; letter-spacing: .5px; }
  .tp-suicide-count .count {
    font-size: 20px; font-weight: 900; color: #ef4444;
    text-shadow: 0 0 12px rgba(239,68,68,.8);
    font-family: 'Courier New', monospace; letter-spacing: 1px;
  }
  .tp-mine-status {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; padding: 8px 10px;
    background: linear-gradient(180deg, #3a0e14, #1a0508);
    border: 1px solid #7f1d1d; border-radius: 6px;
  }
  .tp-mine-status .label { font-size: 11px; color: #fca5a5; font-weight: 700; letter-spacing: .5px; }
  .tp-mine-status .value {
    font-size: 14px; font-weight: 900; color: #ef4444;
    text-shadow: 0 0 12px rgba(239,68,68,.8); letter-spacing: 1px;
  }
  .tp-demon {
    width: 100%; margin-top: 6px; padding: 8px 5px;
    background: linear-gradient(180deg, #4c1d24, #2a0e14);
    color: #fca5a5; border: 1px solid #7f1d1d;
    border-radius: 7px; font-weight: 800; font-size: 11px;
    cursor: pointer; letter-spacing: .4px;
    text-shadow: 0 0 8px rgba(239,68,68,.6);
    font-family: inherit; animation: demonPulse 1.6s ease-in-out infinite;
    line-height: 1.3; min-height: 38px;
  }
  .tp-demon:active:not(:disabled) {
    background: linear-gradient(180deg, #6b2430, #3d141d);
    border-color: #dc2626; filter: brightness(1.15); transform: scale(.98);
  }
  .tp-demon:disabled { opacity: .4; cursor: not-allowed; animation: none; }
  .tp-demon small { font-weight: 400; opacity: .75; font-size: 9px; display: block; margin-top: 1px; }
  @keyframes demonPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
    50% { box-shadow: 0 0 12px 2px rgba(239,68,68,.55); }
  }
  .tp-demon-active {
    width: 100%; margin-top: 6px; padding: 8px 5px;
    background: linear-gradient(180deg, #7f1d1d, #450a0a);
    color: #fef2f2; border: 1px solid #dc2626; border-radius: 7px;
    font-weight: 800; font-size: 11px; text-align: center;
    letter-spacing: .5px; text-shadow: 0 0 10px rgba(255,255,255,.5);
    animation: demonPulse 0.8s ease-in-out infinite;
  }
  .tp-demon-locked {
    width: 100%; margin-top: 6px; padding: 7px 5px;
    background: #161c2a; color: #64748b;
    border: 1px dashed #334155; border-radius: 7px;
    font-weight: 600; font-size: 10px; text-align: center; letter-spacing: .3px;
  }
  /* 爽模式专属：塔面板的金色标记 */
  .tp-op-tag {
    width: 100%; margin-top: 6px; padding: 8px 5px;
    background: linear-gradient(90deg, #3a2a08, #5a4210, #3a2a08);
    color: #fef3c7; border: 1px solid #fbbf24;
    border-radius: 7px; font-weight: 800; font-size: 11px;

    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration, type, volume) {
  const ac = ensureAudio();
  if (!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  const vol = volume || 0.3;
  const now = ac.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(vol, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(now); osc.stop(now + duration + 0.02);
}

function playNoise(duration, volume) {
  const ac = ensureAudio();
  if (!ac) return;
  const bufferSize = Math.floor(ac.sampleRate * duration);
  const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const env = 1 - i / bufferSize;
    data[i] = (Math.random() * 2 - 1) * env * env;
  }
  const src = ac.createBufferSource();
  src.buffer = buffer;
  const gain = ac.createGain();
  const now = ac.currentTime;
  const vol = volume || 0.5;
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  src.connect(gain); gain.connect(masterGain);
  src.start(now);
}

const sfxThrottle = {};
function canPlaySfx(key, intervalMs) {
  const now = performance.now();
  if (!sfxThrottle[key] || now - sfxThrottle[key] > intervalMs) {
    sfxThrottle[key] = now;
    return true;
  }
  return false;
}

/* =========================================================
   工具函数
   ========================================================= */
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function minDistToPath(px, py, path) {
  let min = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    const d = distToSeg(px, py, path[i].x, path[i].y, path[i+1].x, path[i+1].y);
    if (d < min) min = d;
  }
  return min;
}

/* 是否为无限模式（无尽 / 生存赛 / 爽） */
function isInfiniteMode() {
  if (!game) return false;
  return game.isEndless || game.mode === 'defense' || game.mode === 'op';
}

/* 塔伤害（爽模式下按波数缩放） */
function towerDamage(t) {
  let base = TOWER_TYPES[t.type].damage * (1 + 0.35 * (t.dmgLvl - 1));
  const mult = game ? game.level.damageMult : 1;
  base *= mult;
  if (game && game.mode === 'op') {
    /* 爽模式：伤害与小怪血量同比例指数增长 */
    base *= Math.pow(OP_MODE_DAMAGE_BASE, Math.max(0, game.wave - 1));
  }
  return base;
}

function towerFireRate(t) {
  return TOWER_TYPES[t.type].fireRate * (1 + 0.25 * (t.rateLvl - 1));
}

function upgradeCost(t, kind) {
  const base = TOWER_TYPES[t.type].cost;
  const lvl = kind === 'dmg' ? t.dmgLvl : t.rateLvl;
  const mult = game ? game.level.upgradeMult : 1;
  return Math.floor(base * 0.65 * lvl * mult);
}

/* 塔造价（爽模式下全部 1 金币） */
function getTowerCost(key) {
  if (game && game.mode === 'op') return OP_MODE_TOWER_COST;
  if (key === 'defense') return DEFENSE_TOWER_COST;
  if (key === 'suicide') return SUICIDE_CANNON_COST;
  if (key === 'mine') return MINE_COST;
  return TOWER_TYPES[key] ? TOWER_TYPES[key].cost : 0;
}

/* 防御炮台血量（爽模式下 5000） */
function getDefenseMaxHp() {
  if (game && game.mode === 'op') return OP_MODE_DEFENSE_HP;
  return DEFENSE_TOWER_MAX_HP;
}

/* 防御炮台啃咬速率（爽模式下 50/秒 → 100 秒啃光） */
function getDefenseBiteRate() {

  return DEFENSE_TOWER_BITE_RATE;
}

function formatNumber(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + '万亿';
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
  return String(Math.floor(n));
}

/* =========================================================
   塔解锁判断
   ========================================================= */
function isTowerUnlocked(towerKey) {
  if (!game) return true;

  /* 防御炮台永久解锁 */
  if (towerKey === 'defense') return true;

  /* 炸弹、地雷：生存赛禁用 */
  if (towerKey === 'suicide' || towerKey === 'mine') {
    return game.mode !== 'defense';
  }

  /* 生存赛：不能建任何普通塔 */
  if (game.mode === 'defense') return false;

  /* 无尽 / 爽 / 塔限制 / 随机禁用：全塔解锁 */
  if (game.mode === 'endless' || game.mode === 'op' || game.mode === 'limit' || game.mode === 'random') {
    if ((game.mode === 'limit' || game.mode === 'random') &&
        game.bannedTowers && game.bannedTowers.includes(towerKey)) return false;
    return true;
  }

  /* 普通关卡：按解锁进度 */
  for (let i = 0; i < game.level.id - 1; i++) {
    const prev = LEVELS[i];
    if (prev.unlockTower === towerKey) return true;
  }
  if (towerKey === 'arrow' || towerKey === 'cannon') return true;
  return false;
}

/* 恶魔契约可用性（爽模式禁用） */
function isDemonPactAvailable() {
  if (!game) return false;
  if (game.mode === 'defense') return false;
  if (game.mode === 'op') return false;        /* 爽模式不需要契约 */
  if (game.mode === 'endless') return true;
  if (game.mode === 'limit' || game.mode === 'random') return true;
  return game.level.id >= LEVELS.length - 2;
}

/* =========================================================
   固定塔位置校验
   ========================================================= */
function ensureFixedTowersValid(level) {
  const safe = [];
  for (const cfg of level.fixedTowers) {
    let x = cfg.x, y = cfg.y;
    if (minDistToPath(x, y, level.path) < FIXED_TOWER_MIN_DIST) {
      const step = 10;
      let bestX = x, bestY = y, bestDist = minDistToPath(x, y, level.path);
      for (let ox = -80; ox <= 80; ox += step) {
        for (let oy = -80; oy <= 80; oy += step) {
          const nx = x + ox, ny = y + oy;
          if (nx < 24 || nx > W - 24 || ny < 24 || ny > H - 24) continue;
          const d = minDistToPath(nx, ny, level.path);
          if (d > bestDist) { bestDist = d; bestX = nx; bestY = ny; }
        }
      }
      x = bestX; y = bestY;
    }
    safe.push({ x, y, type: cfg.type });
  }
  return safe;
}

function formatTimeAgo(timestamp) {
  if (!timestamp) return '未知时间';
  const diff = Date.now() - timestamp;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' 小时前';
  return Math.floor(hours / 24) + ' 天前';
}
